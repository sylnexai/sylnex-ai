<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SylNex AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1b2a5b, #070b18 65%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5ff;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .daily-card {
      background: linear-gradient(135deg, #00c6ff, #7f5cff);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 12px 30px rgba(0, 198, 255, 0.25);
    }

    .daily-card small {
      opacity: 0.9;
      font-weight: bold;
    }

    .daily-card h2 {
      margin-top: 8px;
      font-size: 20px;
      line-height: 1.3;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      background: rgba(0, 0, 0, 0.35);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 16px;
      font-size: 16px;
      resize: none;
      outline: none;
      margin-bottom: 14px;
    }

    textarea::placeholder {
      color: #aab3d6;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: rgba(255, 255, 255, 0.14);
    }

    .primary {
      grid-column: span 2;
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      color: white;
      box-shadow: 0 10px 25px rgba(0, 210, 255, 0.25);
    }

    .result {
      min-height: 160px;
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(10px);
border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 18px;
      line-height: 1.55;
      color: #eef3ff;
      white-space: pre-wrap;
      max-height: 300px;
overflow-y: auto;
white-space: pre-wrap;
line-height: 1.6;
padding: 16px;
    }

    .xp {
      margin-top: 14px;
      text-align: center;
      color: #00e5ff;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="logo">SylNex AI</div>
    <div class="subtitle">Speak. Grow. Move Forward.</div>

    <select id="languageSelect">
  <option value="auto">🌍 Auto language</option>
  <option value="en-US">English</option>
  <option value="de-DE">Deutsch</option>
  <option value="ru-RU">Русский</option>
  <option value="uz-UZ">Oʻzbek</option>
  <option value="tg-TJ">Тоҷикӣ</option>
  <option value="uk-UA">Українська</option>
  <option value="pl-PL">Polski</option>
  <option value="tr-TR">Türkçe</option>
  <option value="fr-FR">Français</option>
  <option value="es-ES">Español</option>
  <option value="it-IT">Italiano</option>
  <option value="pt-PT">Português</option>
  <option value="ar-SA">العربية</option>
  <option value="hi-IN">हिन्दी</option>
  <option value="zh-CN">中文</option>
</select>

    <div class="daily-card">
      <small>Today’s Opportunity</small>
      <h2>Open your next growth path with AI.</h2>
    </div>

    <button id="dailyIdeaBtn" class="primary">
🔥 Daily Money Idea
</button>
    
    <textarea id="userInput" placeholder="Speak or type your question..."></textarea>

    <div class="buttons">
      <button id="voiceBtn">Voice</button>
      <button id="clearBtn">Clear</button>
      <button id="shareBtn">Share</button>
      <button class="primary" id="generateBtn">Generate Growth Plan</button>
    </div>

    <script>
const translations = {
  "ru-RU": {
    voice: "Голос",
    clear: "Очистить",
    share: "Поделиться",
    generate: "Создать план"
  },
  "en-US": {
    voice: "Voice",
    clear: "Clear",
    share: "Share",
    generate: "Generate Plan"
  },
  "de-DE": {
    voice: "Sprache",
    clear: "Löschen",
    share: "Teilen",
    generate: "Plan erstellen"
  },
  "uz-UZ": {
    voice: "Ovoz",
    clear: "Tozalash",
    share: "Ulashish",
    generate: "Reja yaratish"
  },
  "tg-TJ": {
    voice: "Овоз",
    clear: "Тоза кардан",
    share: "Мубодила",
    generate: "Нақша сохтан"
  },
  "uk-UA": {
  voice: "Голос",
  clear: "Очистити",
  share: "Поділитися",
  generate: "Створити план"
},

"pl-PL": {
  voice: "Głos",
  clear: "Wyczyść",
  share: "Udostępnij",
  generate: "Stwórz plan"
},

"tr-TR": {
  voice: "Ses",
  clear: "Temizle",
  share: "Paylaş",
  generate: "Plan oluştur"
},

"fr-FR": {
  voice: "Voix",
  clear: "Effacer",
  share: "Partager",
  generate: "Créer un plan"
},

"es-ES": {
  voice: "Voz",
  clear: "Limpiar",
  share: "Compartir",
  generate: "Crear plan"
},

"it-IT": {
  voice: "Voce",
  clear: "Cancella",
  share: "Condividi",
  generate: "Crea piano"
},

"pt-PT": {
  voice: "Voz",
  clear: "Limpar",
  share: "Compartilhar",
  generate: "Criar plano"
},

"ar-SA": {
  voice: "صوت",
  clear: "مسح",
  share: "مشاركة",
  generate: "إنشاء خطة"
},

"hi-IN": {
  voice: "आवाज़",
  clear: "साफ करें",
  share: "शेयर",
  generate: "योजना बनाएं"
},

"zh-CN": {
  voice: "语音",
  clear: "清除",
  share: "分享",
  generate: "生成计划"
}
};

      const savedLang = localStorage.getItem("sylnexLanguage");
const browserLang = savedLang || navigator.language;

if (translations[browserLang]) {
  languageSelect.value = browserLang;

  const t = translations[browserLang];

  voiceBtn.innerText = t.voice;
  clearBtn.innerText = t.clear;
  shareBtn.innerText = t.share;
  generateBtn.innerText = t.generate;
}
      
languageSelect.addEventListener("change", () => {
  const lang = languageSelect.value;
  localStorage.setItem("sylnexLanguage", lang);
  const t = translations[lang];

  if (t) {
    voiceBtn.innerText = t.voice;
    clearBtn.innerText = t.clear;
    shareBtn.innerText = t.share;
    generateBtn.innerText = t.generate;
  }
});
</script>

    <div class="result" id="result">
Welcome to SylNex AI.

      
      <div id="loading" style="display:none; text-align:center; margin-top:10px;">
AI is thinking...
</div>

Ask about money, business, content, ideas, growth, or your next step.
    </div>

    <div class="xp" id="xpBox">Growth XP: 0</div>
  </div>

  <script>
    const userInput = document.getElementById("userInput");
    const result = document.getElementById("result");
    const voiceBtn = document.getElementById("voiceBtn");
    const clearBtn = document.getElementById("clearBtn");
    const generateBtn = document.getElementById("generateBtn");
    const xpBox = document.getElementById("xpBox");
    const dailyCard = document.querySelector(".daily-card h2");

    const dailyIdeaBtn = document.getElementById("dailyIdeaBtn");
    
    let xp = 0;
    
    const opportunities = [
  "Start a local delivery service in your city.",
  "Use AI tools to create TikTok videos for businesses.",
  "Offer translation help for migrants in Germany.",
  "Create simple websites for local shops.",
  "Sell digital products online using AI.",
  "Help elderly people with smartphones and technology.",
  "Start a mobile car cleaning service.",
  "Use ChatGPT to write CVs and job applications.",
  "Become a freelance content creator.",
  "Record motivational videos in your native language."
];

dailyCard.innerText =
  opportunities[Math.floor(Math.random() * opportunities.length)];

    clearBtn.addEventListener("click", function () {
      userInput.value = "";
      
      xp += 1;
xpBox.innerText = "Growth XP: " + xp;
      result.innerText = "Ready for your next opportunity.";
    });

const shareBtn = document.getElementById("shareBtn");

shareBtn.addEventListener("click", async function () {

  const text = result.innerText;

  if (!text) return;

  if (navigator.share) {

    try {

      await navigator.share({
        title: "SylNex AI",
        text: text
      });

    } catch (err) {
      console.log(err);
    }

  } else {

    navigator.clipboard.writeText(text);

    shareBtn.innerText = "Copied!";

    setTimeout(() => {
      shareBtn.innerText = "Share";
    }, 2000);
  }
});
    
    generateBtn.addEventListener("click", async function () {
      const text = userInput.value.trim();

      if (!text) {
        result.innerText = "Tell me what you want to improve, earn, build, or understand.";
        return;
      }

      result.innerText = "AI is scanning opportunities for you...";

      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt:
              "You are SylNex AI, a voice-first AI Growth Companion. Answer simply, clearly, and practically. Give the user 3 opportunities, a short action plan, and one next step. User says: " + text
          })
        });

        const data = await response.json();

        const shareBtn = document.getElementById("shareBtn");

shareBtn.addEventListener("click", async function () {

  const text = result.innerText;

  if (!text) return;

  if (navigator.share) {

    try {

      await navigator.share({
        title: "SylNex AI",
        text: text
      });

    } catch (err) {
      console.log(err);
    }

  } else {

    navigator.clipboard.writeText(text);

    shareBtn.innerText = "Copied!";

    setTimeout(() => {
      shareBtn.innerText = "Share";
    }, 2000);
  }
});
        xp += 5;
        xpBox.innerText = "Growth XP: " + xp + "  +5";
      } catch (error) {
        result.innerText = "Connection error. Please try again.";
      }
    });

    if ("webkitSpeechRecognition" in window) {
      const recognition = new webkitSpeechRecognition();

      recognition.lang = languageSelect.value || "ru-RU";
recognition.continuous = false;
recognition.interimResults = false;

      voiceBtn.addEventListener("click", function () {
        voiceBtn.innerText = "Listening...";
        recognition.start();
      });

      recognition.onresult = function (event) {
        userInput.value = event.results[0][0].transcript;
        voiceBtn.innerText = "Voice";
      };

      recognition.onerror = function () {
        voiceBtn.innerText = "Voice";
        result.innerText = "Microphone error. Please try again.";
      };

      recognition.onend = function () {
        voiceBtn.innerText = "Voice";
      };
    } else {
      voiceBtn.addEventListener("click", function () {
        result.innerText = "Voice is not supported in this browser. Try Chrome.";
      });
    }
  </script>
</body>
</html>
