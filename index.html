const extraFallback={
"fa-IR":{name:"Persian",base:"ar-SA"},
"kk-KZ":{name:"Kazakh",base:"ru-RU"},
"ky-KG":{name:"Kyrgyz",base:"ru-RU"},
"az-AZ":{name:"Azerbaijani",base:"tr-TR"},
"ro-RO":{name:"Romanian",base:"en-US"},
"bg-BG":{name:"Bulgarian",base:"ru-RU"}
};

function langCode(){return languageSelect.value==="auto"?"en-US":languageSelect.value}
function t(){
  const code=langCode();
  if(L[code]) return L[code];
  if(extraFallback[code]){
    const base=L[extraFallback[code].base]||L["en-US"];
    return {...base,name:extraFallback[code].name};
  }
  return L["en-US"];
}

let xp=Number(localStorage.getItem("sylnexXP"))||0;
let streak=Number(localStorage.getItem("sylnexStreak"))||1;
let lastVisit=localStorage.getItem("sylnexLastVisit");
let today=new Date().toDateString();
if(lastVisit!==today){if(lastVisit)streak++;localStorage.setItem("sylnexStreak",streak);localStorage.setItem("sylnexLastVisit",today)}

function updateStats(){
 const a=t();
 xpBox.innerText=a.xp+": "+xp;
 streakBox.innerText=a.st+": "+streak;
 levelBox.innerText=xp>=50?a.lv3:xp>=20?a.lv2:a.lv1;
}
function randomDaily(){
 const a=t();
 opportunityText.innerText=a.ops[Math.floor(Math.random()*a.ops.length)];
 missionText.innerText=a.mis[Math.floor(Math.random()*a.mis.length)];
}
function updateUI(){
 const a=t();
 subtitle.innerText=a.sub;opportunityTitle.innerText=a.op;missionTitle.innerText=a.mi;limitNote.innerText=a.limit;
 dailyIdeaBtn.innerText=a.new;voiceBtn.innerText=a.voice;clearBtn.innerText=a.clear;shareBtn.innerText=a.share;generateBtn.innerText=a.gen;
 userInput.placeholder=a.ph;footerNote.innerText=a.foot;result.innerText=a.wel;updateStats();randomDaily();
}
const savedLang=localStorage.getItem("sylnexLanguage");if(savedLang)languageSelect.value=savedLang;updateUI();
languageSelect.addEventListener("change",()=>{localStorage.setItem("sylnexLanguage",languageSelect.value);updateUI()});
function addXP(p){xp+=p;localStorage.setItem("sylnexXP",xp);updateStats()}
dailyIdeaBtn.onclick=()=>{randomDaily();addXP(3)};
clearBtn.onclick=()=>{userInput.value="";result.innerText=t().wel;addXP(1)};
shareBtn.onclick=async()=>{try{if(navigator.share){await navigator.share({title:"SylNex AI",text:result.innerText})}else{await navigator.clipboard.writeText(result.innerText);shareBtn.innerText=t().copy;setTimeout(()=>shareBtn.innerText=t().share,1500)}}catch(e){}};

generateBtn.onclick=async()=>{
 const text=userInput.value.trim();
 if(!text){result.innerText=t().empty;return}
 result.innerText=t().load;
 try{
  const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:text,languageName:t().name})});
  const d=await r.json();
  result.innerText=d.text||d.result||d.message||d.error||JSON.stringify(d);
  addXP(5);
 }catch(e){result.innerText=t().err}
};

let recognition=null,listening=false,finalText="";
if("webkitSpeechRecognition" in window){
 recognition=new webkitSpeechRecognition();
 recognition.continuous=true;recognition.interimResults=true;
 voiceBtn.onclick=()=>{
  if(listening){recognition.stop();listening=false;voiceBtn.innerText=t().voice;return}
  finalText=userInput.value?userInput.value+" ":"";
  recognition.lang=langCode();
  listening=true;voiceBtn.innerText=t().stop;recognition.start();
 };
 recognition.onresult=(event)=>{
  let interim="";
  for(let i=event.resultIndex;i<event.results.length;i++){
   const transcript=event.results[i][0].transcript;
   if(event.results[i].isFinal){finalText+=transcript+" "}else{interim+=transcript}
  }
  userInput.value=(finalText+interim).trim();
 };
 recognition.onerror=()=>{listening=false;voiceBtn.innerText=t().voice;result.innerText=t().mic};
 recognition.onend=()=>{listening=false;voiceBtn.innerText=t().voice};
}else{voiceBtn.onclick=()=>result.innerText=t().nov}
</script>
