*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at top,#24346d,#050711 70%);color:white;display:flex;justify-content:center;align-items:center;padding:16px}
.app{width:100%;max-width:460px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:30px;padding:24px;box-shadow:0 25px 80px rgba(0,0,0,.55);backdrop-filter:blur(18px)}
.logo{text-align:center;font-size:34px;font-weight:900;margin-bottom:6px}
.subtitle{text-align:center;color:#d7ddff;font-size:14px;margin-bottom:18px}
select{width:100%;margin-bottom:16px;padding:13px;border-radius:16px;border:none;background:rgba(255,255,255,.18);color:white;outline:none}
.daily-card{background:linear-gradient(135deg,#00c6ff,#8a5cff);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 12px 32px rgba(0,198,255,.25)}
.daily-card small{opacity:.95;font-weight:bold;font-size:13px}
.daily-card h2{margin-top:8px;font-size:20px;line-height:1.3}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat-card{background:rgba(0,0,0,.30);border-radius:18px;padding:14px;text-align:center;color:#00e5ff;font-weight:bold}
.level{margin-bottom:14px;padding:13px;border-radius:18px;background:rgba(255,255,255,.12);text-align:center;font-weight:800;color:#ffe97a}
textarea{width:100%;min-height:115px;background:rgba(0,0,0,.35);color:white;border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:16px;font-size:16px;resize:none;outline:none;margin-bottom:14px}
textarea::placeholder{color:#b9c3e6}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
button{border:none;border-radius:18px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;color:white;background:rgba(255,255,255,.16);transition:.2s}
button:active{transform:scale(.97)}
.primary{grid-column:span 2;background:linear-gradient(135deg,#00d2ff,#3a7bd5);box-shadow:0 10px 25px rgba(0,210,255,.25)}
.voice-main{background:linear-gradient(135deg,#ff7a18,#ff00cc);box-shadow:0 0 35px rgba(255,0,204,.35)}
.result{min-height:160px;background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.10);border-radius:24px;padding:18px;line-height:1.6;color:#eef3ff;white-space:pre-wrap;max-height:320px;overflow-y:auto}
.footer-note{margin-top:12px;text-align:center;font-size:12px;color:#aeb8e8}
</style>

function browserLang(){
  const b=(navigator.language||"en-US").toLowerCase();
  if(b.startsWith("ru"))return"ru-RU";
  if(b.startsWith("de"))return"de-DE";
  if(b.startsWith("uz"))return"uz-UZ";
  if(b.startsWith("tg"))return"tg-TJ";
  if(b.startsWith("uk"))return"uk-UA";
  if(b.startsWith("pl"))return"pl-PL";
  if(b.startsWith("tr"))return"tr-TR";
  if(b.startsWith("fr"))return"fr-FR";
  if(b.startsWith("es"))return"es-ES";
  if(b.startsWith("it"))return"it-IT";
  if(b.startsWith("pt"))return"pt-PT";
  if(b.startsWith("ar"))return"ar-SA";
  if(b.startsWith("hi"))return"hi-IN";
  if(b.startsWith("zh"))return"zh-CN";
  return"en-US";
}

function langCode(){return languageSelect.value==="auto"?browserLang():languageSelect.value}
function t(){return L[langCode()]||L["en-US"]}

let xp=Number(localStorage.getItem("sylnexXP"))||0;
let streak=Number(localStorage.getItem("sylnexStreak"))||1;
let lastVisit=localStorage.getItem("sylnexLastVisit");
let today=new Date().toDateString();
if(lastVisit!==today){if(lastVisit)streak++;localStorage.setItem("sylnexStreak",streak);localStorage.setItem("sylnexLastVisit",today)}

function updateStats(){
 const a=t();
 xpBox.innerText=a.xp+": "+xp;
 streakBox.innerText=a.st+": "+streak;
 levelBox.innerText=xp>=50?a.lv3:xp>=20?a.lv2:a.lv1;
}

function randomDaily(){
 const a=t();
 opportunityText.innerText=a.ops[Math.floor(Math.random()*a.ops.length)];
 missionText.innerText=a.mis[Math.floor(Math.random()*a.mis.length)];
}

function updateUI(){
 const a=t();
 subtitle.innerText=a.sub;
 opportunityTitle.innerText=a.op;
 missionTitle.innerText=a.mi;
 dailyIdeaBtn.innerText=a.new;
 voiceBtn.innerText=a.voice;
 clearBtn.innerText=a.clear;
 shareBtn.innerText=a.share;
 generateBtn.innerText=a.gen;
 userInput.placeholder=a.ph;
 footerNote.innerText=a.foot;
 result.innerText=a.wel;
 updateStats();
 randomDaily();
}

const savedLang=localStorage.getItem("sylnexLanguage");
if(savedLang)languageSelect.value=savedLang;
updateUI();

languageSelect.addEventListener("change",()=>{localStorage.setItem("sylnexLanguage",languageSelect.value);updateUI()});

function addXP(p){xp+=p;localStorage.setItem("sylnexXP",xp);updateStats()}

dailyIdeaBtn.onclick=()=>{randomDaily();addXP(3)};
clearBtn.onclick=()=>{userInput.value="";result.innerText=t().wel;addXP(1)};

shareBtn.onclick=async()=>{
 try{
  if(navigator.share){await navigator.share({title:"SylNex AI",text:result.innerText})}
  else{await navigator.clipboard.writeText(result.innerText);shareBtn.innerText=t().copy;setTimeout(()=>shareBtn.innerText=t().share,1500)}
 }catch(e){}
};

generateBtn.onclick=async()=>{
 const text=userInput.value.trim();
 if(!text){result.innerText=t().empty;return}
 result.innerText=t().load;
 try{
  const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:text,languageName:t().name})});
  const d=await r.json();
  result.innerText=d.text||d.result||d.message||d.error||JSON.stringify(d);
  addXP(5);
 }catch(e){result.innerText=t().err}
};

let recognition=null;
let listening=false;
let finalText="";

if("webkitSpeechRecognition" in window){
 recognition=new webkitSpeechRecognition();
 recognition.continuous=true;
 recognition.interimResults=true;

 voiceBtn.onclick=()=>{
  if(listening){
   recognition.stop();
   listening=false;
   voiceBtn.innerText=t().voice;
   return;
  }
  finalText=userInput.value?userInput.value+" ":"";
  recognition.lang=langCode();
  listening=true;
  voiceBtn.innerText=t().stop;
  recognition.start();
 };

 recognition.onresult=(event)=>{
  let interim="";
  for(let i=event.resultIndex;i<event.results.length;i++){
   const transcript=event.results[i][0].transcript;
   if(event.results[i].isFinal){finalText+=transcript+" "}
   else{interim+=transcript}
  }
  userInput.value=(finalText+interim).trim();
 };

 recognition.onerror=()=>{
  listening=false;
  voiceBtn.innerText=t().voice;
  result.innerText=t().mic;
 };

 recognition.onend=()=>{
  listening=false;
  voiceBtn.innerText=t().voice;
 };
}else{
 voiceBtn.onclick=()=>result.innerText=t().nov;
}
</script>
