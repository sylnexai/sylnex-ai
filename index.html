<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#050711" />
<title>SylNex AI V2</title>

<style>
:root{
--glass:rgba(255,255,255,.09);
--border:rgba(255,255,255,.14);
--text:#fff;
--muted:#bfc9ff;
--cyan:#00d2ff;
--blue:#3a7bd5;
--purple:#8a5cff;
--pink:#ff00cc;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Inter,Arial,sans-serif
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:16px;
color:var(--text);

background:
radial-gradient(circle at top left,rgba(0,210,255,.28),transparent 32%),
radial-gradient(circle at top right,rgba(255,0,204,.18),transparent 30%),
radial-gradient(circle at bottom,#111b45,#050711 70%);
}

.app{
width:100%;
max-width:480px;
border:1px solid var(--border);
border-radius:34px;
background:var(--glass);
box-shadow:0 30px 90px rgba(0,0,0,.6);
backdrop-filter:blur(22px);
padding:24px;
position:relative;
overflow:hidden;
}

.content{
position:relative;
z-index:1
}

.header{
text-align:center;
margin-bottom:18px
}

.logo{
margin:0 auto 12px;
width:66px;
height:66px;
border-radius:24px;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:950;

background:linear-gradient(
135deg,
var(--cyan),
var(--purple),
var(--pink)
);

box-shadow:0 0 38px rgba(0,210,255,.3);
}

h1{
font-size:34px;
letter-spacing:-1.2px;
margin-bottom:6px
}

.subtitle{
font-size:14px;
line-height:1.45;
color:var(--muted)
}

select{
width:100%;
border:none;
outline:none;
color:white;
background:rgba(255,255,255,.15);
border:1px solid rgba(255,255,255,.13);
border-radius:18px;
padding:14px;
margin-bottom:14px;
font-weight:700;
}

select option{
background:#111b45;
color:white
}

.daily{
border-radius:26px;
padding:18px;
margin-bottom:16px;

background:linear-gradient(
135deg,
rgba(0,198,255,.94),
rgba(138,92,255,.94)
);

box-shadow:0 16px 40px rgba(0,198,255,.22);
}

.kicker{
font-size:12px;
text-transform:uppercase;
letter-spacing:.45px;
font-weight:950;
opacity:.92
}

.dailyText{
margin-top:8px;
font-size:19px;
line-height:1.35;
font-weight:900
}

.voiceWrap{
text-align:center;
margin:18px 0 14px
}

.voiceBtn{
width:118px;
height:118px;
border-radius:50%;
border:none;
color:white;
font-size:42px;
cursor:pointer;

background:linear-gradient(
135deg,
#ff7a18,
var(--pink)
);

box-shadow:
0 0 46px rgba(255,0,204,.34),
inset 0 0 20px rgba(255,255,255,.16);
}

.voiceLabel{
margin-top:10px;
color:var(--muted);
font-size:13px;
font-weight:800
}

textarea{
width:100%;
min-height:118px;
border:none;
outline:none;
resize:none;
color:white;

background:rgba(0,0,0,.34);

border:1px solid rgba(255,255,255,.14);
border-radius:24px;
padding:16px;
font-size:16px;
line-height:1.45;
margin-bottom:12px;
}

textarea::placeholder{
color:#aeb9e8
}
.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:12px
}

button{
border:none;
border-radius:18px;
padding:15px;
font-weight:950;
font-size:15px;
color:white;
cursor:pointer;
background:rgba(255,255,255,.16);
}

.primary{
grid-column:span 2;

background:linear-gradient(
135deg,
var(--cyan),
var(--blue)
);

box-shadow:0 14px 32px rgba(0,210,255,.23);
}

.result{
min-height:180px;
max-height:360px;
overflow-y:auto;
white-space:pre-wrap;

background:rgba(0,0,0,.32);

border:1px solid rgba(255,255,255,.10);
border-radius:26px;
padding:18px;
line-height:1.6;
color:#eef3ff;
font-size:15px;
}

.footer{
text-align:center;
margin-top:13px;
color:#9eaae6;
font-size:12px
}

.pulse{
animation:pulse 1.2s infinite
}

@keyframes pulse{
0%{
box-shadow:0 0 34px rgba(255,0,204,.30)
}

50%{
box-shadow:0 0 60px rgba(0,210,255,.42)
}

100%{
box-shadow:0 0 34px rgba(255,0,204,.30)
}
}

</style>
</head>

<body>

<div class="app">

<div class="content">

<div class="header">

<div class="logo">S</div>

<h1>SylNex AI</h1>

<div class="subtitle" id="subtitle"></div>

</div>

<select id="languageSelect">

<option value="en-US">English</option>

<option value="ru-RU">Русский</option>

<option value="de-DE">Deutsch</option>

<option value="uz-UZ">Oʻzbek</option>

<option value="tg-TJ">Тоҷикӣ</option>

<option value="tr-TR">Türkçe</option>

<option value="pl-PL">Polski</option>

<option value="fr-FR">Français</option>

<option value="ar-SA">العربية</option>

<option value="hi-IN">हिन्दी</option>

<option value="zh-CN">中文</option>

</select>

<div class="daily">

<div class="kicker" id="dailyTitle"></div>

<div class="dailyText" id="dailyText"></div>

</div>

<div class="voiceWrap">

<button class="voiceBtn" id="voiceBtn">🎙</button>

<div class="voiceLabel" id="voiceLabel"></div>

</div>

<textarea id="userInput"></textarea>

<div class="row">

<button id="clearBtn"></button>

<button id="newIdeaBtn"></button>

<button class="primary" id="generateBtn"></button>

</div>

<div class="result" id="result"></div>

<div class="footer" id="footer"></div>

</div>

</div>

<script>
const $ = id => document.getElementById(id);
  const UI = {
"en-US":{
name:"English",
subtitle:"Your AI Growth Companion for money ideas, skills and next steps.",
dailyTitle:"Daily Opportunity",
voiceLabel:"Tap to speak",
listening:"Listening...",
clear:"Clear",
newIdea:"New idea",
generate:"Generate plan",
placeholder:"Ask about money, work, ideas, documents, language, or your next step...",
welcome:"Welcome to SylNex AI.\n\nAsk me what you want to improve, earn, learn or build.",
empty:"Write or say what you want to improve.",
loading:"SylNex is creating a practical plan...",
error:"Connection problem. Try again.",
micError:"Microphone error. Please try again.",
noVoice:"Voice is not supported in this browser.",
footer:"One small step today can open a new opportunity tomorrow.",
ideas:[
"Find one simple service you can offer today.",
"Improve one message, resume or profile using AI.",
"Ask one person what problem they need solved.",
"Turn one skill into a paid service.",
"Learn one useful digital skill today."
]
},

"ru-RU":{
name:"Russian",
subtitle:"Твой AI-компаньон для идей заработка, навыков и следующих шагов.",
dailyTitle:"Возможность дня",
voiceLabel:"Нажмите и говорите",
listening:"Слушаю...",
clear:"Очистить",
newIdea:"Новая идея",
generate:"Создать план",
placeholder:"Спросите про деньги, работу, идеи, язык или следующий шаг...",
welcome:"Добро пожаловать в SylNex AI.\n\nСкажи, что хочешь улучшить, заработать, выучить или построить.",
empty:"Напишите или скажите, что хотите улучшить.",
loading:"SylNex создаёт практичный план...",
error:"Проблема соединения.",
micError:"Ошибка микрофона.",
noVoice:"Голос не поддерживается.",
footer:"Один маленький шаг сегодня может открыть новую возможность завтра.",
ideas:[
"Найдите одну простую услугу рядом.",
"Улучшите своё резюме или сообщение.",
"Спросите человека рядом, какая помощь ему нужна.",
"Превратите один навык в маленький доход.",
"Учите полезный цифровой навык 20 минут."
]
}
};

function current(){
return UI[$("languageSelect").value] || UI["en-US"];
}

function randomIdea(){
const a=current();

$("dailyText").innerText =
a.ideas[Math.floor(Math.random()*a.ideas.length)];
}

function applyLang(){

const a=current();

$("subtitle").innerText=a.subtitle;
$("dailyTitle").innerText=a.dailyTitle;
$("voiceLabel").innerText=a.voiceLabel;
$("clearBtn").innerText=a.clear;
$("newIdeaBtn").innerText=a.newIdea;
$("generateBtn").innerText=a.generate;
$("userInput").placeholder=a.placeholder;
$("result").innerText=a.welcome;
$("footer").innerText=a.footer;

randomIdea();
}

$("languageSelect").addEventListener("change",applyLang);

$("newIdeaBtn").onclick=randomIdea;

$("clearBtn").onclick=()=>{
$("userInput").value="";
$("result").innerText=current().welcome;
};

$("generateBtn").onclick=async()=>{

const a=current();

const prompt=$("userInput").value.trim();

if(!prompt){
$("result").innerText=a.empty;
return;
}

$("result").innerText=a.loading;

try{

const controller = new AbortController();

setTimeout(()=>controller.abort(),25000);

const r=await fetch("/api/generate",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
prompt,
languageName:a.name
}),
signal:controller.signal
});

const d=await r.json();

if(!r.ok){
throw new Error(d.error || "api");
}

$("result").innerText =
d.text || d.result || d.message || "Empty response.";

}catch(e){

$("result").innerText=a.error;

}

};
let recognition=null;
let listening=false;
let finalText="";

if("webkitSpeechRecognition" in window){

recognition=new webkitSpeechRecognition();
recognition.continuous=true;
recognition.interimResults=true;

$("voiceBtn").onclick=()=>{

const a=current();

if(listening){
recognition.stop();
listening=false;
$("voiceBtn").classList.remove("pulse");
$("voiceLabel").innerText=a.voiceLabel;
return;
}

finalText=$("userInput").value ? $("userInput").value+" " : "";
recognition.lang=$("languageSelect").value;
listening=true;
$("voiceBtn").classList.add("pulse");
$("voiceLabel").innerText=a.listening;
recognition.start();

};

recognition.onresult=(event)=>{

let interim="";

for(let i=event.resultIndex;i<event.results.length;i++){
const txt=event.results[i][0].transcript;

if(event.results[i].isFinal){
finalText += txt + " ";
}else{
interim += txt;
}
}

$("userInput").value=(finalText+interim).trim();

};

recognition.onerror=()=>{
listening=false;
$("voiceBtn").classList.remove("pulse");
$("voiceLabel").innerText=current().voiceLabel;
$("result").innerText=current().micError;
};

recognition.onend=()=>{
listening=false;
$("voiceBtn").classList.remove("pulse");
$("voiceLabel").innerText=current().voiceLabel;
};

}else{

$("voiceBtn").onclick=()=>{
$("result").innerText=current().noVoice;
};

}
applyLang();
</script>

</body>
</html>
