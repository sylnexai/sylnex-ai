<!DOCTYPE html>

<head>

  <title>Sylnex AI</title>
  
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #10291d, #050505 60%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 5px;
    }

    .green {
      color: #00ff99;
    }

    textarea {
      width: 90%;
      max-width: 520px;
      height: 130px;
      border-radius: 16px;
      border: none;
      padding: 18px;
      font-size: 16px;
      margin-top: 20px;
      outline: none;
      resize: none;
    }

    button {
      margin-top: 18px;
      padding: 16px 34px;
      border: none;
      border-radius: 14px;
      background: #00ff99;
      color: #06150f;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0,255,153,0.4);
    }

    button:hover {
      transform: scale(1.03);
    }

    select {
    width: 140px;
    padding: 8px;
    border-radius: 8px;
}

    #result {
      margin: 35px auto;
      max-width: 850px;
      color: #00ff99;
      font-size: 17px;
      line-height: 1.6;
      white-space: pre-wrap;
      text-align: left;
      background: rgba(0, 0, 0, 0.35);
      padding: 25px;
      border-radius: 18px;
      border: 1px solid rgba(0,255,153,0.25);
    }

    .small {
      opacity: 0.8;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>🚀 Sylnex AI</h1>

 <p>AI Content Factory v3</p>

 <textarea

</select>
  <button onclick="generateContent()" id="generateBtn">
    🚀 Generate Viral Content
  </button>

  <br />

 <button onclick="copyResult()">
📋 Copy Text
</button>

<button onclick="loadHistory()">
📜 History
</button>
  <button onclick="clearResult()">
🧹 Clear
</button>
 
<div id="history"></div>

  <div id="result"></div>
  <p id="loading" style="display:none; color:#00ff99;">
⏳ AI is generating...
</p>

  <p class="small">#AI #Content #TikTok #Sylnex</p>

  function clearResult() {
  document.getElementById("result").innerHTML = "";
  document.getElementById("topic").value = "";
}
  
 <script>
 async function loadHistory() {
    const history = document.getElementById("history");

    history.innerHTML = "⏳ Loading history...";

    try {
        const response = await fetch("/api/history");

        const data = await response.json();

        if (!data.history || data.history.length === 0) {
            history.innerHTML = "❌ История пуста";
            return;
        }
 
        history.innerHTML = "";

        data.history.forEach(item => {
            history.innerHTML += `
                <div style="
                    background: rgba(255,255,255,0.08);
                    padding: 15px;
                    margin-top: 15px;
                    border-radius: 12px;
                    text-align: left;
                ">
                    <b>${item.title}</b><br><br>
                    ${item.body}<br><br>
                    ${item.hashtags.join(" ")}
                </div>
            `;
        });

    } catch (error) {
        history.innerHTML = "❌ Ошибка загрузки истории";
    }
}
async function generateContent() {
  const topic = document.getElementById("topic").value;
  const result = document.getElementById("result");
  const platform = document.getElementById("platform").value;
  const language = document.getElementById("language").value;
  const contentType = document.getElementById("contentType").value;
  const button = document.getElementById("generateBtn");

  if (!topic.trim()) {
    result.innerHTML = "⚠️ Напиши тему сначала.";
    return;
  }

  document.getElementById("loading").style.display = "block";
result.innerHTML = "";
  button.disabled = true;
  button.innerText = "⏳ Generating...";

  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
     body: JSON.stringify({ topic, platform, language, contentType })
    });

    const text = await response.text();
console.log(text);

let data;

try {
    data = JSON.parse(text);
} catch {
    result.innerHTML = "❌ Ошибка ответа API";
    return;
}
if (!response.ok) {
      result.innerHTML = "❌ Ошибка API: " + (data.error || "unknown error");
      return;
    }

   result.innerHTML = `
  <div style="
    background: rgba(255,255,255,0.06);
    padding: 20px;
    border-radius: 16px;
    border: 1px solid rgba(0,255,153,0.25);
  ">
    <h2 style="color:#00ff99;">
      🔥 ${data.title}
    </h2>

    <div style="
      line-height:1.8;
      font-size:17px;
      color:white;
    ">
      ${data.body}
    </div>

    <br>

    <div style="
      color:#00ff99;
      font-weight:bold;
    ">
      ${data.hashtags.join(" ")}
    </div>
  </div>
`;
  } 
  catch (error) {
    result.innerHTML = "❌ Ошибка: " + error.message;
  } document.getElementById("loading").style.display = "none";finally {
    button.disabled = false;
    button.innerText = "🚀 Generate Viral Content";
  }
}

function copyResult() {
  const text = document.getElementById("result").innerText;

  if (!text.trim()) {
    alert("Сначала сгенерируй текст");
    return;
  }

  navigator.clipboard.writeText(text);
  alert("Copied!");
}
   const topicInput = document.getElementById("topic");
const counter = document.getElementById("counter");

topicInput.addEventListener("input", () => {
  counter.innerText =
    topicInput.value.length + " / 500";
});
</script>
</body>
</html>
