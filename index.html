<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SylNex AI</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #24346d, #050711 70%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 30px;
      padding: 24px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(18px);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #d7ddff;
      font-size: 14px;
      margin-bottom: 18px;
    }

    select {
      width: 100%;
      margin-bottom: 16px;
      padding: 13px;
      border-radius: 16px;
      border: none;
      background: rgba(255,255,255,0.18);
      color: white;
      outline: none;
    }

    .daily-card {
      background: linear-gradient(135deg, #00c6ff, #8a5cff);
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 12px 32px rgba(0, 198, 255, 0.25);
    }

    .daily-card small {
      opacity: 0.95;
      font-weight: bold;
      font-size: 13px;
    }

    .daily-card h2 {
      margin-top: 8px;
      font-size: 20px;
      line-height: 1.3;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: rgba(0,0,0,0.30);
      border-radius: 18px;
      padding: 14px;
      text-align: center;
      color: #00e5ff;
      font-weight: bold;
    }

    .level {
      margin-bottom: 14px;
      padding: 13px;
      border-radius: 18px;
      background: rgba(255,255,255,0.12);
      text-align: center;
      font-weight: 800;
      color: #ffe97a;
    }

    textarea {
      width: 100%;
      min-height: 115px;
      background: rgba(0, 0, 0, 0.35);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 22px;
      padding: 16px;
      font-size: 16px;
      resize: none;
      outline: none;
      margin-bottom: 14px;
    }

    textarea::placeholder { color: #b9c3e6; }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 15px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      background: rgba(255, 255, 255, 0.16);
      transition: 0.2s;
    }

    button:active { transform: scale(0.97); }

    .primary {
      grid-column: span 2;
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      box-shadow: 0 10px 25px rgba(0, 210, 255, 0.25);
    }

    .voice-main {
      background: linear-gradient(135deg, #ff7a18, #ff00cc);
      box-shadow: 0 0 35px rgba(255, 0, 204, 0.35);
    }

    .result {
      min-height: 160px;
      background: rgba(0, 0, 0, 0.30);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px;
      padding: 18px;
      line-height: 1.6;
      color: #eef3ff;
      white-space: pre-wrap;
      max-height: 320px;
      overflow-y: auto;
    }

    .footer-note {
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      color: #aeb8e8;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="logo">SylNex AI</div>
    <div class="subtitle" id="subtitle">Your daily growth companion</div>

    <select id="languageSelect">
      <option value="auto">🌍 Auto language</option>
      <option value="en-US">English</option>
      <option value="de-DE">Deutsch</option>
      <option value="ru-RU">Русский</option>
      <option value="uz-UZ">Oʻzbek</option>
      <option value="tg-TJ">Тоҷикӣ</option>
      <option value="uk-UA">Українська</option>
      <option value="pl-PL">Polski</option>
      <option value="tr-TR">Türkçe</option>
      <option value="fr-FR">Français</option>
      <option value="es-ES">Español</option>
      <option value="it-IT">Italiano</option>
      <option value="pt-PT">Português</option>
      <option value="ar-SA">العربية</option>
      <option value="hi-IN">हिन्दी</option>
      <option value="zh-CN">中文</option>
    </select>

    <div class="daily-card">
      <small id="opportunityTitle">🔥 Daily Opportunity</small>
      <h2 id="opportunityText"></h2>
    </div>

    <div class="daily-card">
      <small id="missionTitle">🎯 Today's Mission</small>
      <h2 id="missionText"></h2>
    </div>

    <div class="stats">
      <div class="stat-card" id="xpBox">Growth XP: 0</div>
      <div class="stat-card" id="streakBox">🔥 Streak: 1</div>
    </div>

    <div class="level" id="levelBox">Level 1 · Explorer</div>

    <button id="dailyIdeaBtn" class="primary">🔥 New Daily Idea</button>

    <textarea id="userInput" placeholder="Speak or type your question..."></textarea>

    <div class="buttons">
      <button id="voiceBtn" class="voice-main">🎙 Voice</button>
      <button id="clearBtn">Clear</button>
      <button id="shareBtn">Share</button>
      <button class="primary" id="generateBtn">Generate Growth Plan</button>
    </div>

    <div class="result" id="result"></div>

    <div class="footer-note" id="footerNote">Small steps every day. Big changes over time.</div>
  </div>

  <script>
    const languageSelect = document.getElementById("languageSelect");
    const subtitle = document.getElementById("subtitle");
    const opportunityTitle = document.getElementById("opportunityTitle");
    const opportunityText = document.getElementById("opportunityText");
    const missionTitle = document.getElementById("missionTitle");
    const missionText = document.getElementById("missionText");
    const xpBox = document.getElementById("xpBox");
    const streakBox = document.getElementById("streakBox");
    const levelBox = document.getElementById("levelBox");
    const dailyIdeaBtn = document.getElementById("dailyIdeaBtn");
    const userInput = document.getElementById("userInput");
    const voiceBtn = document.getElementById("voiceBtn");
    const clearBtn = document.getElementById("clearBtn");
    const shareBtn = document.getElementById("shareBtn");
    const generateBtn = document.getElementById("generateBtn");
    const result = document.getElementById("result");
    const footerNote = document.getElementById("footerNote");

    const content = {
      "en-US": {
        subtitle: "Your daily growth companion",
        opportunityTitle: "🔥 Daily Opportunity",
        missionTitle: "🎯 Today's Mission",
        xp: "Growth XP",
        streak: "🔥 Streak",
        level1: "Level 1 · Explorer",
        level2: "Level 2 · Builder",
        level3: "Level 3 · Hustler",
        dailyBtn: "🔥 New Daily Idea",
        voice: "🎙 Voice",
        clear: "Clear",
        share: "Share",
        generate: "Generate Growth Plan",
        placeholder: "Speak or type your question...",
        welcome: "Welcome to SylNex AI.\n\nAsk about money, business, ideas, growth, or your next step.",
        empty: "Tell me what you want to improve, earn, build, or understand.",
        loading: "AI is scanning opportunities for you...",
        error: "Connection error. Please try again.",
        micError: "Microphone error. Please try again.",
        noVoice: "Voice is not supported in this browser. Try Chrome.",
        copied: "Copied!",
        footer: "Small steps every day. Big changes over time.",
        opportunities: [
          "Use AI today to find one small earning opportunity.",
          "Create one short video idea for TikTok or Instagram.",
          "Improve your CV or profile in 10 minutes.",
          "Find one local service people need in your city.",
          "Learn one useful skill that can help you earn later."
        ],
        missions: [
          "Ask AI for one practical money idea.",
          "Write one small plan for your next step.",
          "Learn 5 new words in another language.",
          "Post one useful idea on social media.",
          "Do one task today that your future self will thank you for."
        ]
      },

      "ru-RU": {
        subtitle: "Твой ежедневный AI-помощник для роста",
        opportunityTitle: "🔥 Возможность дня",
        missionTitle: "🎯 Миссия дня",
        xp: "Рост XP",
        streak: "🔥 Серия",
        level1: "Уровень 1 · Исследователь",
        level2: "Уровень 2 · Создатель",
        level3: "Уровень 3 · Добытчик",
        dailyBtn: "🔥 Новая идея дня",
        voice: "🎙 Голос",
        clear: "Очистить",
        share: "Поделиться",
        generate: "Создать план роста",
        placeholder: "Скажите или напишите вопрос...",
        welcome: "Добро пожаловать в SylNex AI.\n\nСпросите про деньги, бизнес, идеи, рост или следующий шаг.",
        empty: "Напишите, что вы хотите улучшить, заработать, построить или понять.",
        loading: "AI ищет возможности для вас...",
        error: "Ошибка соединения. Попробуйте ещё раз.",
        micError: "Ошибка микрофона. Попробуйте ещё раз.",
        noVoice: "Голос не поддерживается в этом браузере. Попробуйте Chrome.",
        copied: "Скопировано!",
        footer: "Маленькие шаги каждый день. Большие изменения со временем.",
        opportunities: [
          "Используйте AI сегодня, чтобы найти одну маленькую возможность заработать.",
          "Придумайте одну короткую идею для TikTok или Instagram.",
          "Улучшите своё CV или профиль за 10 минут.",
          "Найдите одну услугу, которая нужна людям в вашем городе.",
          "Выучите один полезный навык, который позже поможет заработать."
        ],
        missions: [
          "Спросите AI одну практическую идею для заработка.",
          "Напишите маленький план следующего шага.",
          "Выучите 5 новых слов на другом языке.",
          "Опубликуйте одну полезную идею в соцсетях.",
          "Сделайте сегодня один шаг, за который будущее «вы» скажет спасибо."
        ]
      },

      "de-DE": {
        subtitle: "Dein täglicher AI-Begleiter für Wachstum",
        opportunityTitle: "🔥 Chance des Tages",
        missionTitle: "🎯 Mission des Tages",
        xp: "Wachstum XP",
        streak: "🔥 Serie",
        level1: "Level 1 · Entdecker",
        level2: "Level 2 · Macher",
        level3: "Level 3 · Hustler",
        dailyBtn: "🔥 Neue Tagesidee",
        voice: "🎙 Sprache",
        clear: "Löschen",
        share: "Teilen",
        generate: "Wachstumsplan erstellen",
        placeholder: "Sprich oder schreibe deine Frage...",
        welcome: "Willkommen bei SylNex AI.\n\nFrage nach Geld, Business, Ideen, Wachstum oder deinem nächsten Schritt.",
        empty: "Sag mir, was du verbessern, verdienen, aufbauen oder verstehen möchtest.",
        loading: "AI sucht Chancen für dich...",
        error: "Verbindungsfehler. Bitte versuche es erneut.",
        micError: "Mikrofonfehler. Bitte versuche es erneut.",
        noVoice: "Sprache wird in diesem Browser nicht unterstützt. Versuche Chrome.",
        copied: "Kopiert!",
        footer: "Kleine Schritte jeden Tag. Große Veränderungen mit der Zeit.",
        opportunities: [
          "Nutze AI heute, um eine kleine Verdienstmöglichkeit zu finden.",
          "Erstelle eine kurze Videoidee für TikTok oder Instagram.",
          "Verbessere deinen Lebenslauf oder dein Profil in 10 Minuten.",
          "Finde einen lokalen Service, den Menschen in deiner Stadt brauchen.",
          "Lerne eine nützliche Fähigkeit, die dir später Geld bringen kann."
        ],
        missions: [
          "Frage AI nach einer praktischen Geldidee.",
          "Schreibe einen kleinen Plan für deinen nächsten Schritt.",
          "Lerne 5 neue Wörter in einer anderen Sprache.",
          "Poste eine nützliche Idee in sozialen Medien.",
          "Mach heute eine Sache, für die dein zukünftiges Ich dankbar ist."
        ]
      },

      "pl-PL": {
        subtitle: "Twój codzienny AI towarzysz rozwoju",
        opportunityTitle: "🔥 Szansa dnia",
        missionTitle: "🎯 Misja dnia",
        xp: "Rozwój XP",
        streak: "🔥 Seria",
        level1: "Poziom 1 · Odkrywca",
        level2: "Poziom 2 · Twórca",
        level3: "Poziom 3 · Hustler",
        dailyBtn: "🔥 Nowy pomysł dnia",
        voice: "🎙 Głos",
        clear: "Wyczyść",
        share: "Udostępnij",
        generate: "Stwórz plan rozwoju",
        placeholder: "Powiedz lub wpisz pytanie...",
        welcome: "Witamy w SylNex AI.\n\nZapytaj o pieniądze, biznes, pomysły, rozwój lub następny krok.",
        empty: "Napisz, co chcesz poprawić, zarobić, zbudować lub zrozumieć.",
        loading: "AI szuka dla Ciebie możliwości...",
        error: "Błąd połączenia. Spróbuj ponownie.",
        micError: "Błąd mikrofonu. Spróbuj ponownie.",
        noVoice: "Głos nie jest obsługiwany w tej przeglądarce. Spróbuj Chrome.",
        copied: "Skopiowano!",
        footer: "Małe kroki każdego dnia. Wielkie zmiany z czasem.",
        opportunities: [
          "Użyj dziś AI, aby znaleźć jedną małą możliwość zarobku.",
          "Stwórz jeden krótki pomysł na TikTok lub Instagram.",
          "Popraw swoje CV lub profil w 10 minut.",
          "Znajdź jedną lokalną usługę potrzebną ludziom w Twoim mieście.",
          "Naucz się jednej przydatnej umiejętności, która może pomóc zarabiać."
        ],
        missions: [
          "Zapytaj AI o jeden praktyczny pomysł na zarobek.",
          "Napisz mały plan następnego kroku.",
          "Naucz się 5 nowych słów w innym języku.",
          "Opublikuj jedną przydatną myśl w social media.",
          "Zrób dziś jedną rzecz, za którą podziękuje Ci przyszły Ty."
        ]
      }
    };

    const fallbackMap = {
      "uz-UZ": "ru-RU",
      "tg-TJ": "ru-RU",
      "uk-UA": "ru-RU",
      "tr-TR": "en-US",
      "fr-FR": "en-US",
      "es-ES": "en-US",
      "it-IT": "en-US",
      "pt-PT": "en-US",
      "ar-SA": "en-US",
      "hi-IN": "en-US",
      "zh-CN": "en-US",
      "auto": "en-US"
    };

    function getLang() {
      const selected = languageSelect.value;
      if (selected === "auto") {
        const browserLang = navigator.language || "en-US";
        return content[browserLang] ? browserLang : "en-US";
      }
      return content[selected] ? selected : (fallbackMap[selected] || "en-US");
    }

    function t() {
      return content[getLang()] || content["en-US"];
    }

    let xp = Number(localStorage.getItem("sylnexXP")) || 0;
    let streak = Number(localStorage.getItem("sylnexStreak")) || 1;

    const today = new Date().toDateString();
    const lastVisit = localStorage.getItem("sylnexLastVisit");

    if (lastVisit !== today) {
      if (lastVisit) streak += 1;
      localStorage.setItem("sylnexStreak", streak);
      localStorage.setItem("sylnexLastVisit", today);
    }

    function updateLevel() {
      const lang = t();
      if (xp >= 50) {
        levelBox.innerText = lang.level3;
      } else if (xp >= 20) {
        levelBox.innerText = lang.level2;
      } else {
        levelBox.innerText = lang.level1;
      }
    }

    function addXP(points) {
      xp += points;
      localStorage.setItem("sylnexXP", xp);
      updateStats();
    }

    function updateStats() {
      const lang = t();
      xpBox.innerText = lang.xp + ": " + xp;
      streakBox.innerText = lang.streak + ": " + streak;
      updateLevel();
    }

    function randomDaily() {
      const lang = t();
      opportunityText.innerText = lang.opportunities[Math.floor(Math.random() * lang.opportunities.length)];
      missionText.innerText = lang.missions[Math.floor(Math.random() * lang.missions.length)];
    }

    function updateUI() {
      const lang = t();
      subtitle.innerText = lang.subtitle;
      opportunityTitle.innerText = lang.opportunityTitle;
      missionTitle.innerText = lang.missionTitle;
      dailyIdeaBtn.innerText = lang.dailyBtn;
      voiceBtn.innerText = lang.voice;
      clearBtn.innerText = lang.clear;
      shareBtn.innerText = lang.share;
      generateBtn.innerText = lang.generate;
      userInput.placeholder = lang.placeholder;
      footerNote.innerText = lang.footer;
      result.innerText = lang.welcome;
      updateStats();
      randomDaily();
    }

    const savedLang = localStorage.getItem("sylnexLanguage");
    if (savedLang) languageSelect.value = savedLang;

    updateUI();

    languageSelect.addEventListener("change", function () {
      localStorage.setItem("sylnexLanguage", languageSelect.value);
      updateUI();
    });

    dailyIdeaBtn.addEventListener("click", function () {
      randomDaily();
      addXP(3);
    });

    clearBtn.addEventListener("click", function () {
      userInput.value = "";
      result.innerText = t().welcome;
      addXP(1);
    });

    shareBtn.addEventListener("click", async function () {
      const text = result.innerText;
      if (!text) return;

      try {
        if (navigator.share) {
          await navigator.share({ title: "SylNex AI", text: text });
        } else {
          await navigator.clipboard.writeText(text);
          shareBtn.innerText = t().copied;
          setTimeout(() => { shareBtn.innerText = t().share; }, 2000);
        }
      } catch (err) {
        console.log(err);
      }
    });

    generateBtn.addEventListener("click", async function () {
      const text = userInput.value.trim();
      const langCode = languageSelect.value;

      if (!text) {
        result.innerText = t().empty;
        return;
      }

      result.innerText = t().loading;

      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt:
              "Selected language: " + langCode + ". " +
              "If selected language is auto, answer in the same language as the user. " +
              "Answer clearly, shortly and practically. " +
              "Give 3 practical money/growth opportunities, a short action plan, and one next step. " +
              "User says: " + text
          })
        });

        const data = await response.json();
        result.innerText = data.text || data.result || data.message || JSON.stringify(data);
        addXP(5);

      } catch (error) {
        result.innerText = t().error;
      }
    });

    if ("webkitSpeechRecognition" in window) {
      const recognition = new webkitSpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      voiceBtn.addEventListener("click", function () {
        const selected = languageSelect.value;
        recognition.lang = selected === "auto" ? (navigator.language || "en-US") : selected;
        voiceBtn.innerText = "🎙 Listening...";
        recognition.start();
      });

      recognition.onresult = function (event) {
        userInput.value = event.results[0][0].transcript;
        voiceBtn.innerText = t().voice;
      };

      recognition.onerror = function () {
        voiceBtn.innerText = t().voice;
        result.innerText = t().micError;
      };

      recognition.onend = function () {
        voiceBtn.innerText = t().voice;
      };
    } else {
      voiceBtn.addEventListener("click", function () {
        result.innerText = t().noVoice;
      });
    }
  </script>
</body>
</html>
