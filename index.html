<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sylnex AI</title>
<!-- update -->
  <style>
    body{
      background:black;
      color:white;
      font-family:Arial;
      text-align:center;
      padding-top:80px;
    }

    textarea{
      width:300px;
      height:120px;
      border-radius:10px;
      padding:10px;
    }

    button{
      padding:15px 30px;
      background:#00ff99;
      border:none;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
      margin-top:10px;
    }

    #result{
      margin-top:30px;
      color:#00ff99;
      white-space:pre-line;
      width:80%;
      margin-left:auto;
      margin-right:auto;
    }
  </style>
</head>

<body>

<h1>🚀 Sylnex AI</h1><p style="color:#00ff99;">
AI Powered by OpenAI GPT
</p>  
<p>AI Content Factory</p>

<textarea id="topic" maxlength="500"
placeholder="Напиши тему..."></textarea>

<br><br>

<button onclick="generateContent()" id="generateBtn">
🚀 Generate Viral Content
</button>

<div id="result"></div>

<button onclick="copyResult()">
📋 Copy Text
</button>

<script>
async function generateContent() {
alert("Кнопка работает");
  const topic =
    document.getElementById("topic").value;

  document.getElementById("result").innerHTML =
    "Генерирую...";

  try {

    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ topic })
    });

    const data = await response.json();

    document.getElementById("result").innerHTML =
      `
      <h2>${data.title}</h2>
      <p>${data.body}</p>
      <p>${data.hashtags.join(" ")}</p>
      `;

} catch(error) {
  document.getElementById("result").innerHTML =
    "Ошибка: " + error.message;
}
function copyResult() {
const text = document.getElementById("result").innerText;
navigator.clipboard.writeText(text);
alert("Copied!");
}</script>

</body>
</html>
