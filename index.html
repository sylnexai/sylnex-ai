<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SylNex AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:900px;
}

.logo{
font-size:42px;
font-weight:700;
margin-bottom:10px;
text-align:center;
}

.subtitle{
text-align:center;
opacity:0.7;
margin-bottom:40px;
}

.chat-box{
background:#1e293b;
border-radius:24px;
padding:20px;
box-shadow:0 0 30px rgba(0,0,0,0.3);
}

textarea{
width:100%;
height:140px;
background:#0f172a;
border:none;
outline:none;
resize:none;
border-radius:16px;
padding:20px;
font-size:18px;
color:white;
margin-bottom:20px;
}

.actions{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.left-actions{
display:flex;
gap:10px;
}

button{
border:none;
padding:14px 18px;
border-radius:14px;
cursor:pointer;
font-size:15px;
font-weight:600;
transition:0.2s;
}

.upload-btn{
background:#334155;
color:white;
}

.voice-btn{
background:#334155;
color:white;
}

.generate-btn{
background:#06b6d4;
color:white;
flex:1;
}

button:hover{
transform:scale(1.03);
opacity:0.9;
}

#result{
margin-top:25px;
background:#0f172a;
padding:20px;
border-radius:18px;
line-height:1.7;
white-space:pre-wrap;
min-height:120px;
}

.loading{
opacity:0.6;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{opacity:0.3;}
50%{opacity:1;}
100%{opacity:0.3;}
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
SylNex AI
</div>

<div class="subtitle">
Smart AI Assistant for Content, Business & Ideas
</div>

<div class="chat-box">

<textarea
id="userInput"
placeholder="Ask anything..."
></textarea>

<div class="actions">

<div class="left-actions">

<button class="upload-btn">
📎 Upload
</button>

<button class="voice-btn" id="voiceBtn">
🎤 Voice
</button>

</div>

<button
class="generate-btn"
id="generateBtn"
>
Generate
</button>

</div>

<div id="result">
Your AI response will appear here...
</div>

  <div id="smartActions" style="display:none; margin-top:15px; flex-wrap:wrap; gap:10px;">

<button class="upload-btn">
🔥 Make Viral
</button>

<button class="upload-btn">
💰 Monetize
</button>

<button class="upload-btn">
🎬 Reel Idea
</button>

<button class="upload-btn">
✨ Improve
</button>

<button class="upload-btn" id="copyBtn">
📤 Copy
</button>

</div>
  
</div>

</div>

<script>

const generateBtn = document.getElementById("generateBtn");
const userInput = document.getElementById("userInput");
const result = document.getElementById("result");

generateBtn.addEventListener("click", generateContent);

async function generateContent(){

const prompt = userInput.value;

if(!prompt){
alert("Please enter a prompt");
return;
}

result.innerHTML = "Thinking...";
result.classList.add("loading");

try{

const response = await fetch("/api/generate",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({prompt})
});

const data = await response.json();

result.classList.remove("loading");

result.innerHTML =
data.result ||
"Something went wrong.";

}catch(error){

result.classList.remove("loading");

result.innerHTML =
"Error connecting to AI.";

console.error(error);

}

}

const voiceBtn = document.getElementById("voiceBtn");

if ('webkitSpeechRecognition' in window) {

const recognition = new webkitSpeechRecognition();

recognition.continuous = false;
recognition.interimResults = false;

voiceBtn.addEventListener("click", () => {
recognition.start();
});

recognition.onresult = function(event) {
userInput.value =
event.results[0][0].transcript;
};

}

  const copyBtn = document.getElementById("copyBtn");

copyBtn.addEventListener("click", () => {

const text = result.innerText;

navigator.clipboard.writeText(text);

copyBtn.innerText = "✅ Copied";

setTimeout(() => {
copyBtn.innerText = "📤 Copy";
}, 2000);

});
  
</script>

</body>
</html>
<!-- force deploy v2 -->
