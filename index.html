<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#050711" />
<title>SylNex AI V2</title>
<style>
:root{
  --bg:#050711;--glass:rgba(255,255,255,.09);--glass2:rgba(255,255,255,.14);
  --border:rgba(255,255,255,.14);--text:#fff;--muted:#bfc9ff;
  --cyan:#00d2ff;--blue:#3a7bd5;--purple:#8a5cff;--pink:#ff00cc;--gold:#ffe97a;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:var(--text);
  background:
    radial-gradient(circle at top left,rgba(0,210,255,.28),transparent 32%),
    radial-gradient(circle at top right,rgba(255,0,204,.18),transparent 30%),
    radial-gradient(circle at bottom,#111b45,#050711 70%);
}
.app{
  width:100%;max-width:480px;border:1px solid var(--border);border-radius:34px;
  background:var(--glass);box-shadow:0 30px 90px rgba(0,0,0,.6);backdrop-filter:blur(22px);
  padding:24px;position:relative;overflow:hidden;
}
.app:before{content:"";position:absolute;inset:-80px auto auto -80px;width:190px;height:190px;border-radius:50%;background:rgba(0,210,255,.13)}
.app:after{content:"";position:absolute;right:-90px;bottom:-90px;width:210px;height:210px;border-radius:50%;background:rgba(255,0,204,.10)}
.content{position:relative;z-index:1}
.header{text-align:center;margin-bottom:18px}
.logo{
  margin:0 auto 12px;width:66px;height:66px;border-radius:24px;
  display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:950;
  background:linear-gradient(135deg,var(--cyan),var(--purple),var(--pink));
  box-shadow:0 0 38px rgba(0,210,255,.3);
}
h1{font-size:34px;letter-spacing:-1.2px;margin-bottom:6px}
.subtitle{font-size:14px;line-height:1.45;color:var(--muted)}
select{
  width:100%;border:none;outline:none;color:white;background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:14px;margin-bottom:14px;font-weight:700;
}
select option{background:#111b45;color:white}
.daily{
  border-radius:26px;padding:18px;margin-bottom:16px;
  background:linear-gradient(135deg,rgba(0,198,255,.94),rgba(138,92,255,.94));
  box-shadow:0 16px 40px rgba(0,198,255,.22);
}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.45px;font-weight:950;opacity:.92}
.dailyText{margin-top:8px;font-size:19px;line-height:1.35;font-weight:900}
.voiceWrap{text-align:center;margin:18px 0 14px}
.voiceBtn{
  width:118px;height:118px;border-radius:50%;border:none;color:white;font-size:42px;cursor:pointer;
  background:linear-gradient(135deg,#ff7a18,var(--pink));
  box-shadow:0 0 46px rgba(255,0,204,.34), inset 0 0 20px rgba(255,255,255,.16);
  transition:.18s;
}
.voiceBtn:active{transform:scale(.96)}
.voiceLabel{margin-top:10px;color:var(--muted);font-size:13px;font-weight:800}
textarea{
  width:100%;min-height:118px;border:none;outline:none;resize:none;color:white;
  background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.14);
  border-radius:24px;padding:16px;font-size:16px;line-height:1.45;margin-bottom:12px;
}
textarea::placeholder{color:#aeb9e8}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
button{
  border:none;border-radius:18px;padding:15px;font-weight:950;font-size:15px;color:white;cursor:pointer;
  background:rgba(255,255,255,.16);transition:.18s;
}
button:active{transform:scale(.97)}
.primary{
  grid-column:span 2;background:linear-gradient(135deg,var(--cyan),var(--blue));
  box-shadow:0 14px 32px rgba(0,210,255,.23);
}
.result{
  min-height:180px;max-height:360px;overflow-y:auto;white-space:pre-wrap;
  background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.10);
  border-radius:26px;padding:18px;line-height:1.6;color:#eef3ff;font-size:15px;
}
.footer{text-align:center;margin-top:13px;color:#9eaae6;font-size:12px}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 34px rgba(255,0,204,.30)}50%{box-shadow:0 0 60px rgba(0,210,255,.42)}100%{box-shadow:0 0 34px rgba(255,0,204,.30)}}
@media(max-width:380px){h1{font-size:30px}.voiceBtn{width:104px;height:104px}}
</style>
</head>

      <button class="primary" id="generateBtn"></button>

</div>

function current(){ return UI[$("languageSelect").value] || UI["en-US"]; }
function randomIdea(){ const a=current(); $("dailyText").innerText = a.ideas[Math.floor(Math.random()*a.ideas.length)]; }
function applyLang(){
 const a=current();
 document.documentElement.lang = $("languageSelect").value.split("-")[0];
 document.documentElement.dir = $("languageSelect").value==="ar-SA" ? "rtl" : "ltr";
 $("subtitle").innerText=a.subtitle; $("dailyTitle").innerText=a.dailyTitle; $("voiceLabel").innerText=a.voiceLabel;
 $("clearBtn").innerText=a.clear; $("newIdeaBtn").innerText=a.newIdea; $("generateBtn").innerText=a.generate;
 $("userInput").placeholder=a.placeholder; $("result").innerText=a.welcome; $("footer").innerText=a.footer;
 randomIdea();
 localStorage.setItem("sylnex_v2_lang",$("languageSelect").value);
}
$("languageSelect").value = localStorage.getItem("sylnex_v2_lang") || "en-US";
$("languageSelect").addEventListener("change",applyLang);

$("newIdeaBtn").onclick=randomIdea;
$("clearBtn").onclick=()=>{ $("userInput").value=""; $("result").innerText=current().welcome; };

$("generateBtn").onclick=async()=>{
 const a=current();
 const prompt=$("userInput").value.trim();
 if(!prompt){ $("result").innerText=a.empty; return; }
 $("result").innerText=a.loading;
 try{
   const r=await fetch("/api/generate",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({prompt,languageName:a.name})
   });
   if(!r.ok) throw new Error("api");
   const d=await r.json();
   $("result").innerText=d.text || d.result || d.message || a.localAnswer(prompt);
 }catch(e){
   $("result").innerText=a.error + a.localAnswer(prompt);
 }
};

let recognition=null, listening=false, finalText="";
if("webkitSpeechRecognition" in window){
 recognition=new webkitSpeechRecognition();
 recognition.continuous=true;
 recognition.interimResults=true;
 $("voiceBtn").onclick=()=>{
   const a=current();
   if(listening){
     recognition.stop();
     listening=false;
     $("voiceBtn").classList.remove("pulse");
     $("voiceLabel").innerText=a.voiceLabel;
     return;
   }
   finalText=$("userInput").value ? $("userInput").value+" " : "";
   recognition.lang=$("languageSelect").value;
   listening=true;
   $("voiceBtn").classList.add("pulse");
   $("voiceLabel").innerText=a.listening;
   recognition.start();
 };
 recognition.onresult=(event)=>{
   let interim="";
   for(let i=event.resultIndex;i<event.results.length;i++){
     const txt=event.results[i][0].transcript;
     if(event.results[i].isFinal) finalText += txt + " ";
     else interim += txt;
   }
   $("userInput").value=(finalText+interim).trim();
 };
 recognition.onerror=()=>{
   listening=false;
   $("voiceBtn").classList.remove("pulse");
   $("voiceLabel").innerText=current().voiceLabel;
   $("result").innerText=current().micError;
 };
 recognition.onend=()=>{
   listening=false;
   $("voiceBtn").classList.remove("pulse");
   $("voiceLabel").innerText=current().voiceLabel;
 };
}else{
 $("voiceBtn").onclick=()=>{ $("result").innerText=current().noVoice; };
}
applyLang();
</script>
