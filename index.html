<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#050711" />
<title>SylNex AI V2</title>

<style>
:root{
--glass:rgba(255,255,255,.09);
--border:rgba(255,255,255,.14);
--text:#fff;
--muted:#bfc9ff;
--cyan:#00d2ff;
--blue:#3a7bd5;
--purple:#8a5cff;
--pink:#ff00cc;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Inter,Arial,sans-serif
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:16px;
color:var(--text);

background:
radial-gradient(circle at top left,rgba(0,210,255,.28),transparent 32%),
radial-gradient(circle at top right,rgba(255,0,204,.18),transparent 30%),
radial-gradient(circle at bottom,#111b45,#050711 70%);
}

.app{
width:100%;
max-width:480px;
border:1px solid var(--border);
border-radius:34px;
background:var(--glass);
box-shadow:0 30px 90px rgba(0,0,0,.6);
backdrop-filter:blur(22px);
padding:24px;
position:relative;
overflow:hidden;
}

.content{
position:relative;
z-index:1
}

.header{
text-align:center;
margin-bottom:18px
}

.logo{
margin:0 auto 12px;
width:66px;
height:66px;
border-radius:24px;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:950;

background:linear-gradient(
135deg,
var(--cyan),
var(--purple),
var(--pink)
);

box-shadow:0 0 38px rgba(0,210,255,.3);
}

h1{
font-size:34px;
letter-spacing:-1.2px;
margin-bottom:6px
}

.subtitle{
font-size:14px;
line-height:1.45;
color:var(--muted)
}

select{
width:100%;
border:none;
outline:none;
color:white;
background:rgba(255,255,255,.15);
border:1px solid rgba(255,255,255,.13);
border-radius:18px;
padding:14px;
margin-bottom:14px;
font-weight:700;
}

select option{
background:#111b45;
color:white
}

.daily{
border-radius:26px;
padding:18px;
margin-bottom:16px;

background:linear-gradient(
135deg,
rgba(0,198,255,.94),
rgba(138,92,255,.94)
);

box-shadow:0 16px 40px rgba(0,198,255,.22);
}

.kicker{
font-size:12px;
text-transform:uppercase;
letter-spacing:.45px;
font-weight:950;
opacity:.92
}

.dailyText{
margin-top:8px;
font-size:19px;
line-height:1.35;
font-weight:900
}

.voiceWrap{
text-align:center;
margin:18px 0 14px
}

.voiceBtn{
width:118px;
height:118px;
border-radius:50%;
border:none;
color:white;
font-size:42px;
cursor:pointer;

background:linear-gradient(
135deg,
#ff7a18,
var(--pink)
);

box-shadow:
0 0 46px rgba(255,0,204,.34),
inset 0 0 20px rgba(255,255,255,.16);
}

.voiceLabel{
margin-top:10px;
color:var(--muted);
font-size:13px;
font-weight:800
}

textarea{
width:100%;
min-height:118px;
border:none;
outline:none;
resize:none;
color:white;

background:rgba(0,0,0,.34);

border:1px solid rgba(255,255,255,.14);
border-radius:24px;
padding:16px;
font-size:16px;
line-height:1.45;
margin-bottom:12px;
}

textarea::placeholder{
color:#aeb9e8
}
