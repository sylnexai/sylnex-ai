<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#050711" />
<title>SylNex AI — Growth Companion</title>
<style>
:root{
  --bg:#050711;--card:rgba(255,255,255,.09);--glass:rgba(255,255,255,.13);
  --border:rgba(255,255,255,.14);--text:#fff;--muted:#c9d3ff;
  --cyan:#00d2ff;--purple:#8a5cff;--pink:#ff00cc;--gold:#ffe97a;--green:#66ffcc;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
body{
  min-height:100vh;color:var(--text);display:flex;align-items:center;justify-content:center;padding:16px;
  background:
    radial-gradient(circle at top left,rgba(0,210,255,.30),transparent 30%),
    radial-gradient(circle at top right,rgba(255,0,204,.20),transparent 32%),
    radial-gradient(circle at bottom,#111b45,#050711 70%);
}
.app{
  width:100%;max-width:500px;background:var(--card);border:1px solid var(--border);
  border-radius:34px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.62);
  backdrop-filter:blur(20px);overflow:hidden;position:relative;
}
.app:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;top:-120px;right:-110px;background:rgba(0,210,255,.12)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,var(--cyan),var(--purple),var(--pink));display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 0 28px rgba(0,210,255,.28)}
.logo{font-size:27px;font-weight:950;letter-spacing:-.8px}
.badge{font-size:11px;color:#061018;background:var(--green);padding:7px 10px;border-radius:999px;font-weight:900}
.subtitle{color:var(--muted);font-size:13px;line-height:1.4;margin-bottom:14px;position:relative;z-index:1}
select,textarea{width:100%;border:none;outline:none;color:white}
select{margin-bottom:13px;padding:13px 14px;border-radius:17px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.12)}
select option{background:#111b45;color:white}
.hero{background:linear-gradient(135deg,#00c6ff,#8a5cff);border-radius:27px;padding:18px;margin-bottom:11px;box-shadow:0 16px 40px rgba(0,198,255,.24);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-70px;bottom:-85px;background:rgba(255,255,255,.16)}
small{opacity:.92;font-weight:900;font-size:12px;letter-spacing:.35px;text-transform:uppercase}
.hero h2{font-size:20px;line-height:1.3;margin-top:8px;position:relative;z-index:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.card{background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.10);border-radius:22px;padding:14px;min-height:108px}
.card h2{font-size:14px;line-height:1.35;margin-top:8px;color:#eef3ff}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:11px}
.stat{background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:12px;text-align:center}
.val{font-size:18px;font-weight:950;color:var(--cyan)}
.lab{font-size:11px;color:var(--muted);margin-top:3px}
.level{margin-bottom:11px;padding:13px;border-radius:18px;background:rgba(255,255,255,.12);text-align:center;font-weight:900;color:var(--gold)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
button{border:none;border-radius:18px;padding:14px;font-size:15px;font-weight:900;cursor:pointer;color:white;background:rgba(255,255,255,.16);transition:.18s}
button:hover{filter:brightness(1.07)}button:active{transform:scale(.97)}
.primary{grid-column:span 2;background:linear-gradient(135deg,#00d2ff,#3a7bd5);box-shadow:0 12px 28px rgba(0,210,255,.24)}
.voice{background:linear-gradient(135deg,#ff7a18,#ff00cc);box-shadow:0 0 30px rgba(255,0,204,.30)}
textarea{
  min-height:112px;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.14);
  border-radius:23px;padding:16px;font-size:16px;resize:none;margin-bottom:12px;line-height:1.45;
}
textarea::placeholder{color:#b9c3e6}
.result{min-height:170px;max-height:340px;overflow-y:auto;background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.10);border-radius:24px;padding:17px;line-height:1.58;color:#eef3ff;white-space:pre-wrap}
.history{margin-top:12px;display:none}
.history-title{font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:800}
.history-item{font-size:13px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:15px;padding:10px;margin-bottom:7px;cursor:pointer;color:#eaf0ff}
.footer{margin-top:12px;text-align:center;font-size:12px;color:#aeb8e8}
@media(max-width:390px){.logo{font-size:24px}.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.badge{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="mark">S</div><div class="logo">SylNex AI</div></div>
    <div class="badge">MVP READY</div>
  </div>

  <div class="subtitle" id="subtitle"></div>

  <select id="languageSelect">
    <option value="auto">🌍 Auto / English</option>
    <option value="en-US">English</option>
    <option value="de-DE">Deutsch</option>
    <option value="ru-RU">Русский</option>
    <option value="uz-UZ">Oʻzbek</option>
    <option value="tg-TJ">Тоҷикӣ</option>
    <option value="uk-UA">Українська</option>
    <option value="pl-PL">Polski</option>
    <option value="tr-TR">Türkçe</option>
    <option value="fr-FR">Français</option>
    <option value="es-ES">Español</option>
    <option value="it-IT">Italiano</option>
    <option value="pt-PT">Português</option>
    <option value="ar-SA">العربية</option>
    <option value="hi-IN">हिन्दी</option>
    <option value="zh-CN">中文</option>
  </select>

  <div class="hero">
    <small id="opportunityTitle"></small>
    <h2 id="opportunityText"></h2>
  </div>

  <div class="grid">
    <div class="card"><small id="missionTitle"></small><h2 id="missionText"></h2></div>
    <div class="card"><small id="focusTitle"></small><h2 id="focusText"></h2></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="val" id="xpVal">0</div><div class="lab" id="xpLab"></div></div>
    <div class="stat"><div class="val" id="streakVal">1</div><div class="lab" id="streakLab"></div></div>
    <div class="stat"><div class="val" id="ideasVal">0</div><div class="lab" id="ideasLab"></div></div>
  </div>

  <div class="level" id="levelBox"></div>

  <button id="dailyIdeaBtn" class="primary" style="width:100%;margin-bottom:12px"></button>

  <textarea id="userInput"></textarea>

  <div class="actions">
    <button id="voiceBtn" class="voice"></button>
    <button id="clearBtn"></button>
    <button id="shareBtn"></button>
    <button id="historyBtn"></button>
    <button class="primary" id="generateBtn"></button>
  </div>

  <div class="result" id="result"></div>

  <div class="history" id="historyBox">
    <div class="history-title" id="historyTitle"></div>
    <div id="historyList"></div>
  </div>

  <div class="footer" id="footerNote"></div>
</div>

<script>
const $=id=>document.getElementById(id);

const base = {
 "en-US": {
  name:"English", sub:"Your voice-first AI companion for growth, money ideas and daily opportunities.",
  op:"🔥 Daily Opportunity", mi:"🎯 Today's Mission", focus:"🧠 Growth Focus",
  xp:"Growth XP", streak:"Streak", ideas:"Ideas", lv1:"Level 1 · Explorer", lv2:"Level 2 · Builder", lv3:"Level 3 · Hustler",
  new:"🔥 New Daily Idea", voice:"🎙 Voice", stop:"⏹ Stop", clear:"Clear", share:"Share", hist:"History", gen:"Generate Growth Plan",
  ph:"Speak or type your question: money, work, ideas, documents, language, next step...",
  wel:"Welcome to SylNex AI.\n\nAsk me: “How can I earn this week?”, “What should I learn?”, “Give me a business idea”, or “Create my growth plan.”",
  empty:"Tell me what you want to improve, earn, build or understand.",
  load:"SylNex AI is thinking and creating a practical growth plan...",
  err:"Connection error. Demo answer created locally.\n\n",
  mic:"Microphone error. Please try again.", nov:"Voice is not supported in this browser. Try Chrome.", copy:"Copied!",
  foot:"Small steps every day. Big changes over time.",
  ops:["Offer one simple help service to people around you today.","Find one local problem and turn it into a small service idea.","Improve your profile, CV or offer in 10 minutes.","Use AI to create one useful post, flyer or message today.","Ask one person what problem they need solved."],
  mis:["Send one message that can open an opportunity.","Write a 3-step plan for one small income idea.","Learn one useful digital skill for 20 minutes.","Create one simple offer and show it to someone.","Do one action your future self will thank you for."],
  foc:["Money idea","Language skill","Better profile","Local service","AI tools","Confidence","Discipline"]
 },
 "ru-RU": {
  name:"Russian", sub:"Твой голосовой AI-компаньон для роста, денег и ежедневных возможностей.",
  op:"🔥 Возможность дня", mi:"🎯 Миссия дня", focus:"🧠 Фокус роста",
  xp:"Рост XP", streak:"Серия", ideas:"Идеи", lv1:"Уровень 1 · Исследователь", lv2:"Уровень 2 · Создатель", lv3:"Уровень 3 · Добытчик",
  new:"🔥 Новая идея дня", voice:"🎙 Голос", stop:"⏹ Стоп", clear:"Очистить", share:"Поделиться", hist:"История", gen:"Создать план роста",
  ph:"Скажите или напишите вопрос: деньги, работа, идеи, документы, язык, следующий шаг...",
  wel:"Добро пожаловать в SylNex AI.\n\nСпроси: «Как мне заработать на этой неделе?», «Что мне учить?», «Дай бизнес-идею» или «Сделай мой план роста».",
  empty:"Напишите, что вы хотите улучшить, заработать, построить или понять.",
  load:"SylNex AI думает и создаёт практичный план роста...",
  err:"Ошибка соединения. Создан демо-ответ локально.\n\n",
  mic:"Ошибка микрофона. Попробуйте ещё раз.", nov:"Голос не поддерживается. Попробуйте Chrome.", copy:"Скопировано!",
  foot:"Маленькие шаги каждый день. Большие изменения со временем.",
  ops:["Предложите сегодня одну простую услугу людям вокруг.","Найдите локальную проблему и превратите её в маленькую бизнес-идею.","Улучшите профиль, резюме или предложение за 10 минут.","Используйте AI, чтобы создать полезный пост, флаер или сообщение.","Спросите одного человека, какую проблему ему нужно решить."],
  mis:["Отправьте одно сообщение, которое может открыть возможность.","Напишите план из 3 шагов для одной идеи дохода.","Учите один полезный цифровой навык 20 минут.","Создайте простое предложение и покажите кому-то.","Сделайте одно действие, за которое будущее «вы» скажет спасибо."],
  foc:["Идея заработка","Язык","Профиль","Локальная услуга","AI-инструменты","Уверенность","Дисциплина"]
 },
 "de-DE": {
  name:"German", sub:"Dein Voice-First AI-Begleiter für Wachstum, Geldideen und tägliche Chancen.",
  op:"🔥 Chance des Tages", mi:"🎯 Mission des Tages", focus:"🧠 Wachstumsfokus",
  xp:"Wachstum XP", streak:"Serie", ideas:"Ideen", lv1:"Level 1 · Entdecker", lv2:"Level 2 · Macher", lv3:"Level 3 · Hustler",
  new:"🔥 Neue Tagesidee", voice:"🎙 Sprache", stop:"⏹ Stopp", clear:"Löschen", share:"Teilen", hist:"Verlauf", gen:"Wachstumsplan erstellen",
  ph:"Sprich oder schreibe deine Frage: Geld, Arbeit, Ideen, Dokumente, Sprache, nächster Schritt...",
  wel:"Willkommen bei SylNex AI.\n\nFrag: „Wie kann ich diese Woche Geld verdienen?“, „Was soll ich lernen?“ oder „Erstelle meinen Wachstumsplan“.",
  empty:"Sag, was du verbessern, verdienen, aufbauen oder verstehen möchtest.",
  load:"SylNex AI denkt nach und erstellt einen praktischen Wachstumsplan...",
  err:"Verbindungsfehler. Demo-Antwort lokal erstellt.\n\n",
  mic:"Mikrofonfehler. Bitte erneut versuchen.", nov:"Sprache wird nicht unterstützt. Versuche Chrome.", copy:"Kopiert!",
  foot:"Kleine Schritte jeden Tag. Große Veränderungen mit der Zeit.",
  ops:["Biete heute eine einfache Hilfe in deiner Nähe an.","Finde ein lokales Problem und mache daraus eine kleine Service-Idee.","Verbessere dein Profil, deinen Lebenslauf oder dein Angebot in 10 Minuten.","Nutze AI für einen nützlichen Post, Flyer oder eine Nachricht.","Frage eine Person, welches Problem sie gelöst haben möchte."],
  mis:["Sende eine Nachricht, die eine Chance öffnen kann.","Schreibe einen 3-Schritte-Plan für eine Einkommensidee.","Lerne 20 Minuten eine digitale Fähigkeit.","Erstelle ein einfaches Angebot und zeige es jemandem.","Mach eine Aktion, für die dein zukünftiges Ich dankbar ist."],
  foc:["Geldidee","Sprache","Profil","Lokaler Service","AI-Tools","Selbstvertrauen","Disziplin"]
 }
};

const aliases = {
 "auto":"en-US","uz-UZ":"en-US","tg-TJ":"ru-RU","uk-UA":"ru-RU","pl-PL":"en-US","tr-TR":"en-US",
 "fr-FR":"en-US","es-ES":"en-US","it-IT":"en-US","pt-PT":"en-US","ar-SA":"en-US","hi-IN":"en-US","zh-CN":"en-US"
};

function langCode(){return $("languageSelect").value==="auto"?"en-US":$("languageSelect").value}
function t(){return base[langCode()] || base[aliases[$("languageSelect").value]] || base["en-US"]}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

let xp=Number(localStorage.getItem("sylnexXP")||0);
let streak=Number(localStorage.getItem("sylnexStreak")||1);
let ideas=Number(localStorage.getItem("sylnexIdeas")||0);
let last=localStorage.getItem("sylnexLastVisit");
let today=new Date().toDateString();
if(last!==today){ if(last) streak++; localStorage.setItem("sylnexStreak",streak); localStorage.setItem("sylnexLastVisit",today); }

function setText(){
 const a=t();
 $("subtitle").innerText=a.sub; $("opportunityTitle").innerText=a.op; $("missionTitle").innerText=a.mi; $("focusTitle").innerText=a.focus;
 $("xpLab").innerText=a.xp; $("streakLab").innerText=a.streak; $("ideasLab").innerText=a.ideas;
 $("dailyIdeaBtn").innerText=a.new; $("voiceBtn").innerText=a.voice; $("clearBtn").innerText=a.clear; $("shareBtn").innerText=a.share; $("historyBtn").innerText=a.hist; $("generateBtn").innerText=a.gen;
 $("userInput").placeholder=a.ph; $("footerNote").innerText=a.foot; $("result").innerText=a.wel; $("historyTitle").innerText=a.hist;
 refreshCards(); refreshStats(); renderHistory();
}
function refreshCards(){
 const a=t();
 $("opportunityText").innerText=pick(a.ops);
 $("missionText").innerText=pick(a.mis);
 $("focusText").innerText=pick(a.foc);
}
function refreshStats(){
 const a=t();
 $("xpVal").innerText=xp; $("streakVal").innerText=streak; $("ideasVal").innerText=ideas;
 $("levelBox").innerText=xp>=80?a.lv3:xp>=30?a.lv2:a.lv1;
}
function addXP(n){xp+=n;localStorage.setItem("sylnexXP",xp);refreshStats()}
function addIdea(){ideas++;localStorage.setItem("sylnexIdeas",ideas);refreshStats()}

function localAnswer(input){
 const a=t();
 if(a.name==="Russian"){
  return `План роста от SylNex AI:\n\n1. Главная цель: ${input}\n\n2. Первый маленький шаг сегодня:\nСделайте одно конкретное действие за 15–30 минут: сообщение, поиск, звонок, мини-план или улучшение профиля.\n\n3. Идея возможности:\nПодумайте, кому рядом с вами можно помочь: доставка, перевод, документы, AI-контент, поиск информации, простая услуга.\n\n4. Следующий шаг:\nНапишите короткое предложение: “Я могу помочь с ___ за ___”. Отправьте 3 людям или разместите в группе.\n\n5. Миссия на сегодня:\nНе думать долго. Сделать один маленький шаг и вернуться завтра за новой возможностью.`;
 }
 if(a.name==="German"){
  return `SylNex AI Wachstumsplan:\n\n1. Ziel: ${input}\n\n2. Kleiner Schritt heute:\nMach eine konkrete Aktion in 15–30 Minuten: Nachricht, Suche, Anruf, Mini-Plan oder Profil verbessern.\n\n3. Chance:\nÜberlege, wem du helfen kannst: Lieferung, Übersetzung, Dokumente, AI-Content, Recherche oder einfacher Service.\n\n4. Nächster Schritt:\nSchreibe ein kurzes Angebot: “Ich kann bei ___ für ___ helfen”. Sende es an 3 Personen oder poste es in einer Gruppe.\n\n5. Tagesmission:\nNicht zu lange nachdenken. Einen kleinen Schritt machen und morgen zurückkommen.`;
 }
 return `SylNex AI Growth Plan:\n\n1. Main goal: ${input}\n\n2. Small step today:\nDo one concrete action in 15–30 minutes: send a message, search, call, write a mini-plan, or improve your profile.\n\n3. Opportunity idea:\nThink who you can help nearby: delivery, translation, documents, AI content, research, simple local service.\n\n4. Next move:\nWrite a short offer: “I can help with ___ for ___”. Send it to 3 people or post it in a group.\n\n5. Today’s mission:\nDo not overthink. Make one small move and come back tomorrow for a new opportunity.`;
}

function saveHistory(q,a){
 const list=JSON.parse(localStorage.getItem("sylnexHistory")||"[]");
 list.unshift({q,a,date:new Date().toLocaleString()});
 localStorage.setItem("sylnexHistory",JSON.stringify(list.slice(0,6)));
 renderHistory();
}
function renderHistory(){
 const list=JSON.parse(localStorage.getItem("sylnexHistory")||"[]");
 $("historyList").innerHTML=list.map((x,i)=>`<div class="history-item" data-i="${i}">${x.date}<br><b>${x.q.slice(0,60)}</b></div>`).join("");
 document.querySelectorAll(".history-item").forEach(el=>el.onclick=()=>{
   const item=list[Number(el.dataset.i)];
   $("userInput").value=item.q; $("result").innerText=item.a;
 });
}

$("dailyIdeaBtn").onclick=()=>{refreshCards();addXP(3);addIdea()};
$("clearBtn").onclick=()=>{$("userInput").value="";$("result").innerText=t().wel;addXP(1)};
$("historyBtn").onclick=()=>{$("historyBox").style.display=$("historyBox").style.display==="block"?"none":"block"};
$("shareBtn").onclick=async()=>{
 try{
  if(navigator.share){await navigator.share({title:"SylNex AI",text:$("result").innerText})}
  else{await navigator.clipboard.writeText($("result").innerText);$("shareBtn").innerText=t().copy;setTimeout(()=>$("shareBtn").innerText=t().share,1400)}
 }catch(e){}
};
$("generateBtn").onclick=async()=>{
 const text=$("userInput").value.trim(); const a=t();
 if(!text){$("result").innerText=a.empty;return}
 $("result").innerText=a.load;
 try{
  const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:text,languageName:a.name})});
  if(!r.ok) throw new Error("api");
  const d=await r.json();
  const out=d.text||d.result||d.message||localAnswer(text);
  $("result").innerText=out; saveHistory(text,out); addXP(8); addIdea();
 }catch(e){
  const out=a.err+localAnswer(text);
  $("result").innerText=out; saveHistory(text,out); addXP(5); addIdea();
 }
};

let recognition=null,listening=false,finalText="";
if("webkitSpeechRecognition" in window){
 recognition=new webkitSpeechRecognition();
 recognition.continuous=true; recognition.interimResults=true;
 $("voiceBtn").onclick=()=>{
  const a=t();
  if(listening){recognition.stop();listening=false;$("voiceBtn").innerText=a.voice;return}
  finalText=$("userInput").value?$("userInput").value+" ":"";
  recognition.lang=langCode();
  listening=true;$("voiceBtn").innerText=a.stop;recognition.start();
 };
 recognition.onresult=(event)=>{
  let interim="";
  for(let i=event.resultIndex;i<event.results.length;i++){
    const tr=event.results[i][0].transcript;
    if(event.results[i].isFinal){finalText+=tr+" "}else{interim+=tr}
  }
  $("userInput").value=(finalText+interim).trim();
 };
 recognition.onerror=()=>{listening=false;$("voiceBtn").innerText=t().voice;$("result").innerText=t().mic};
 recognition.onend=()=>{listening=false;$("voiceBtn").innerText=t().voice};
}else{
 $("voiceBtn").onclick=()=>{$("result").innerText=t().nov};
}

const saved=localStorage.getItem("sylnexLanguage");
if(saved) $("languageSelect").value=saved;
$("languageSelect").addEventListener("change",()=>{localStorage.setItem("sylnexLanguage",$("languageSelect").value);setText()});
setText();
</script>
</body>
</html>
