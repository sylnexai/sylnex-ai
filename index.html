<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SylNex AI</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1b2a5b, #070b18 65%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .logo { text-align: center; font-size: 34px; font-weight: 800; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #cbd5ff; font-size: 14px; margin-bottom: 18px; }

    select {
      width: 100%;
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 16px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: white;
    }

    .daily-card {
      background: linear-gradient(135deg, #00c6ff, #7f5cff);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 12px 30px rgba(0, 198, 255, 0.25);
    }

    .daily-card small { opacity: 0.9; font-weight: bold; }
    .daily-card h2 { margin-top: 8px; font-size: 20px; line-height: 1.3; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: rgba(0,0,0,0.28);
      border-radius: 18px;
      padding: 14px;
      text-align: center;
      color: #00e5ff;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      background: rgba(0, 0, 0, 0.35);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 16px;
      font-size: 16px;
      resize: none;
      outline: none;
      margin-bottom: 14px;
    }

    textarea::placeholder { color: #aab3d6; }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: rgba(255, 255, 255, 0.14);
    }

    .primary {
      grid-column: span 2;
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      box-shadow: 0 10px 25px rgba(0, 210, 255, 0.25);
    }

    .voice-main {
      font-size: 18px;
      background: linear-gradient(135deg, #ff7a18, #af00ff);
      box-shadow: 0 0 30px rgba(175, 0, 255, 0.35);
    }

    .result {
      min-height: 160px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 18px;
      line-height: 1.6;
      color: #eef3ff;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>

<body>

    <div class="logo">SylNex AI</div>
    <div class="subtitle">Your daily growth companion</div>

    <select id="languageSelect">
      <option value="auto">🌍 Auto language</option>
      <option value="en-US">English</option>
      <option value="de-DE">Deutsch</option>
      <option value="ru-RU">Русский</option>
      <option value="uz-UZ">Oʻzbek</option>
      <option value="tg-TJ">Тоҷикӣ</option>
      <option value="uk-UA">Українська</option>
      <option value="pl-PL">Polski</option>
      <option value="tr-TR">Türkçe</option>
      <option value="fr-FR">Français</option>
      <option value="es-ES">Español</option>
      <option value="it-IT">Italiano</option>
      <option value="pt-PT">Português</option>
      <option value="ar-SA">العربية</option>
      <option value="hi-IN">हिन्दी</option>
      <option value="zh-CN">中文</option>
    </select>

    <div class="daily-card">
      <small>🔥 Daily Opportunity</small>
      <h2 id="opportunityText">Open your next growth path with AI.</h2>
    </div>

    <div class="daily-card">
      <small>🎯 Today's Mission</small>
      <h2 id="missionText">Complete one small action to improve your future today.</h2>
    </div>

    <div class="stats">
      <div class="stat-card" id="xpBox">Growth XP: 0</div>
      <div class="stat-card" id="streakBox">🔥 Streak: 1</div>
    </div>

    <button id="dailyIdeaBtn" class="primary">🔥 New Daily Idea</button>

    <textarea id="userInput" placeholder="Speak or type your question..."></textarea>

    <div class="buttons">
      <button id="voiceBtn" class="voice-main">🎙 Voice</button>
      <button id="clearBtn">Clear</button>
      <button id="shareBtn">Share</button>
      <button class="primary" id="generateBtn">Generate Growth Plan</button>
    </div>

    <div class="result" id="result">
Welcome to SylNex AI.

Ask about money, business, content, ideas, growth, or your next step.
    </div>
  </div>
