<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sylnex AI</title>
 
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #10291d, #050505 60%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 5px;
    }

    .green {
      color: #00ff99;
    }

    textarea {
      width: 90%;
      max-width: 520px;
      height: 130px;
      border-radius: 16px;
      border: none;
      padding: 18px;
      font-size: 16px;
      margin-top: 20px;
      outline: none;
      resize: none;
    }

    button {
      margin-top: 18px;
      padding: 16px 34px;
      border: none;
      border-radius: 14px;
      background: #00ff99;
      color: #06150f;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0,255,153,0.4);
    }

    button:hover {
      transform: scale(1.03);
    }

    select {
    width: 140px;
    padding: 8px;
    border-radius: 8px;
}

    #result {
      margin: 35px auto;
      max-width: 850px;
      color: #00ff99;
      font-size: 17px;
      line-height: 1.6;
      white-space: pre-wrap;
      text-align: left;
      background: rgba(0, 0, 0, 0.35);
      padding: 25px;
      border-radius: 18px;
      border: 1px solid rgba(0,255,153,0.25);
    }

    .small {
      opacity: 0.8;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>🚀 Sylnex AI</h1>
  <h3 class="green">AI Powered by OpenAI GPT</h3>
  <p>AI Content Factory</p>

  <textarea id="topic" placeholder="Напиши тему..."></textarea>
  <br />

<select id="platform">
  <option value="TikTok">TikTok</option>
  <option value="Instagram Reels">Instagram Reels</option>
  <option value="YouTube Shorts">YouTube Shorts</option>
</select>
<select id="language">
  <option value="Русский">Русский</option>
  <option value="English">English</option>
  <option value="Deutsch">Deutsch</option>
  <option value="Français">Français</option>
  <option value="Español">Español</option>
  <option value="Italiano">Italiano</option>
  <option value="Português">Português</option>
  <option value="العربية">العربية</option>
  <option value="Türkçe">Türkçe</option>
  <option value="中文">中文</option>
  <option value="日本語">日本語</option>
</select>
  <select id="contentType">
  <option value="Viral Ideas">Viral Ideas</option>
  <option value="Hooks">Hooks</option>
  <option value="Script">Script</option>
  <option value="Hashtags">Hashtags</option>
  <option value="CTA">CTA</option>
</select>
  <button onclick="generateContent()" id="generateBtn">
    🚀 Generate Viral Content
  </button>

  <br />

 <button onclick="copyResult()">
📋 Copy Text
</button>

<button onclick="loadHistory()">
📜 History
</button>

<div id="history"></div>

  <div id="result"></div>

  <p class="small">#AI #Content #TikTok #Sylnex</p>

 <script>
async function generateContent() {
  const topic = document.getElementById("topic").value;
  const result = document.getElementById("result");
  const platform = document.getElementById("platform").value;
  const language = document.getElementById("language").value;
  const contentType = document.getElementById("contentType").value;
  const button = document.getElementById("generateBtn");

  if (!topic.trim()) {
    result.innerHTML = "⚠️ Напиши тему сначала.";
    return;
  }

  result.innerHTML = "⏳ Генерирую вирусный контент...";
  button.disabled = true;
  button.innerText = "⏳ Generating...";

  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
     body: JSON.stringify({ topic, platform, language, contentType })
    });

function copyResult() {
  const text = document.getElementById("result").innerText;

  if (!text.trim()) {
    alert("Сначала сгенерируй текст");
    return;
  }

  navigator.clipboard.writeText(text);
  alert("Copied!");
}
</script>
</body>
</html>
